name: community-watcher

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python watcher.py

      - name: Commit seen-posts state
        if: always()
        run: |
          if [ -f watcher_state.json ]; then
            git config user.name "watcher-bot"
            git config user.email "actions@github.com"
            git add watcher_state.json
            git diff --cached --quiet || (git commit -m "watcher: update state" && git push)
          fi
