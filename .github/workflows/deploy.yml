name: Deploy site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Create Pages project if missing
        run: npx wrangler@3 pages project create clearquarter --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy . --project-name=clearquarter --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Alert Discord if deploy failed
        if: failure()
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d '{"content":"ClearQuarter site deploy FAILED. Details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
